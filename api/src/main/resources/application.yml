server:
  port: ${PORT:8080}

spring:
  application:
    name: smartcitas-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://tu-host-postgres:5432/smartcitas}
    username: ${DATABASE_USERNAME:smartcitas}
    password: ${DATABASE_PASSWORD:smartcitas}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

smartcitas:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://tu-dominio-frontend}
  supabase:
    url: ${SUPABASE_URL:}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:}
    jwt-audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
